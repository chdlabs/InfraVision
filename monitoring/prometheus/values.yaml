grafana:
  adminPassword: InfraVision2026!

  service:
    type: ClusterIP

  persistence:
    enabled: true
    size: 5Gi

prometheus:
  prometheusSpec:

    retention: 15d

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce

          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
